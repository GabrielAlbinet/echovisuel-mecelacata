<section class="m-3 rounded-2xl border border-stone-200 bg-white p-4 shadow-sm">
  <p>Prénom : {{ participant().firstName }}</p>
  <p>Nom : {{ participant().lastName }}</p>
  <p>E-mail : {{ participant().email }}</p>
  <p>Statut : {{ participant().status }}</p>
  <p>Billet : {{ ticketName() }}</p>
  <input type="checkbox" #check (change)="onChange(check.checked)" />

  <div class="mt-3 flex gap-2">
    <button
      type="button"
      (click)="edit.emit(participant())"
      class="rounded-full border border-stone-200 px-4 py-1.5 text-xs font-semibold uppercase tracking-wide text-stone-500 transition hover:bg-stone-50"
    >
      Modifier
    </button>

    <button
      type="button"
      (click)="remove.emit(participant())"
      class="rounded-full border border-red-200 px-4 py-1.5 text-xs font-semibold uppercase tracking-wide text-red-600 transition hover:bg-red-50"
    >
      Supprimer
    </button>
  </div>
</section>
