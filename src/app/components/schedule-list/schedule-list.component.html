<div class="space-y-12">
  @for (dateKey of dateKeys(); track dateKey) {
    <div>
      <h2 class="mb-6 text-2xl font-bold capitalize text-orange-600">
        {{ formatDate(dateKey) }}
      </h2>

      <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
        @for (event of groupedEvents()[dateKey]; track event.id) {
          <app-event-card [event]="event" (edit)="edit.emit($event)" />
        }
      </div>
    </div>
  }
</div>
