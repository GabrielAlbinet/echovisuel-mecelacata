<form [formGroup]="createTicketForm" (ngSubmit)="submitTicket()">
    <p>Nom :</p>
    <input type="text" placeholder="nom" formControlName="name" class="border">
    <p>Description :</p>
    <input type="text" placeholder="description" formControlName="description" class="border">
    <p>Prix :</p>
    <input type="number" step="0.01" formControlName="price" class="border">
    <p>Quantité :</p>
    <input type="number" formControlName="quantity" class="border">
    <p>Date début validité :</p>
    <input type="date" placeholder="name" formControlName="dateBeginning" class="border">
    <p>Date fin validité :</p>
    <input type="date" placeholder="name" formControlName="dateEnd" class="border">
    <button type="submit" [disabled]="!createTicketForm.valid">Créer billet</button>
</form>
