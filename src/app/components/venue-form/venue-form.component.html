<form [formGroup]="venueForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4 max-w-md mx-auto p-5 mt-6">
<h3 class="text-xl font-semibold text-center mb-6">{{ venueService.venueIdBeingEdited() !== null ? 'Modifier un lieu' : 'Ajouter un lieu' }}</h3>

    <div class="flex flex-col gap-1">
        <label for="name">Nom du lieu</label>
        <input id="name" type="text" formControlName="name" class="border rounded-sm p-2"/>
    </div>

    <div class="flex flex-col gap-1">
        <label for="type">Type de lieu</label>
        <input id="type" type="text" formControlName="type" class="border rounded-sm p-2"/>
    </div>

    <div class="flex flex-col gap-1">
        <label for="description">Description</label>
        <input id="description" type="text" formControlName="description" class="border rounded-sm p-2"/>
    </div>

    <div class="flex flex-col gap-1">
        <label for="capacity">Capacité d'accueil (en nombre de personnes)</label>
        <input id="capacity" type="number" formControlName="capacity" class="border rounded-sm p-2"/>
    </div>

    <div class="flex flex-col gap-1">
        <label for="location">Ville</label>
        <input id="location" type="text" formControlName="location" class="border rounded-sm p-2"/>
    </div>

    <div class="flex flex-col gap-1">
        <label for="image">URL d'image</label>
        <input id="image" type="text" formControlName="image" class="border rounded-sm p-2"/>
    </div>

    <button type="submit" class="bg-red-900 text-white rounded-sm p-2 mt-2">
        {{ venueService.venueIdBeingEdited() !== null ? 'Update' : 'Valider' }}
    </button>
</form>
