<div>
    <p>{{ticket().name}}</p>
    @if(ticket().available===true){
        <p>Prix: {{ticket().price}}</p>
        <p>Nombre de ticket: {{ticket().quantity}}</p>
    }@else{
        <p>Épuisé</p>
    }
    <p>Description: {{ticket().description}}</p>
     <p>Conditions: {{ticket().condition}}</p>
</div>
