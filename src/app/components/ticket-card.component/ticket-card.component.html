<div class="border rounded-sm box-border md:size-50 size-47">
    <p>{{ticket().name}}</p>
    @if(ticket().available===true){
        <p>Prix: {{ticket().price}}</p>
        <p>Nombre de ticket: {{ticket().quantity}}</p>
    }@else{
        <p>Épuisé</p>
    }
    <p>Description: {{ticket().description}}</p>
     <p>Conditions: {{ticket().condition}}</p>
     <button type="button" (click)="select(ticket())">Selectionner</button>
</div>
