<form
  [formGroup]="form"
  (ngSubmit)="submit()"
  class="flex flex-wrap items-center gap-3 rounded-2xl border border-stone-200 bg-white p-6 shadow-sm"
>
  <select
    formControlName="artistId"
    class="rounded-full border border-stone-200 bg-white px-4 py-2 text-sm text-stone-900"
  >
    <option [ngValue]="null">Artiste</option>
    @for (artist of artists(); track artist.id) {
      <option [ngValue]="artist.id">{{ artist.name }}</option>
    }
  </select>

  <select
    formControlName="venueId"
    class="rounded-full border border-stone-200 bg-white px-4 py-2 text-sm text-stone-900"
  >
    <option [ngValue]="null">Lieu</option>
    @for (venue of venues(); track venue.id) {
      <option [ngValue]="venue.id">{{ venue.name }}</option>
    }
  </select>

  <input
    type="date"
    formControlName="date"
    class="rounded-full border border-stone-200 bg-white px-4 py-2 text-sm text-stone-900"
  />

  <input
    type="time"
    formControlName="startTime"
    class="rounded-full border border-stone-200 bg-white px-4 py-2 text-sm text-stone-900"
  />

  <input
    type="time"
    formControlName="endTime"
    class="rounded-full border border-stone-200 bg-white px-4 py-2 text-sm text-stone-900"
  />

  <button
    type="submit"
    class="rounded-full bg-orange-100 px-4 py-2 text-xs font-semibold uppercase tracking-wide text-orange-600 transition hover:bg-orange-200"
  >
    Programmer
  </button>
</form>

@if (showTimeErrorModal()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-stone-900/40 px-6">
    <div class="w-full max-w-sm rounded-2xl border border-stone-200 bg-white p-6 text-center shadow-sm">
      <p class="text-lg font-bold text-stone-900">Heures incohérentes</p>
      <p class="mt-2 text-sm text-stone-500">
        L'heure de fin doit être postérieure à l'heure de début.
      </p>

      <button
        type="button"
        (click)="closeTimeErrorModal()"
        class="mt-6 rounded-full bg-orange-100 px-6 py-2 text-xs font-semibold uppercase tracking-wide text-orange-600 transition hover:bg-orange-200"
      >
        Annuler
      </button>
    </div>
  </div>
}

@if (showConfirmModal()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-stone-900/40 px-6">
    <div class="w-full max-w-sm rounded-2xl border border-stone-200 bg-white p-6 text-center shadow-sm">
      <p class="text-lg font-bold text-stone-900">Confirmer la programmation</p>
      <p class="mt-2 text-sm text-stone-500">
        Voulez-vous ajouter {{ pendingEvent()?.artistName }} le {{ pendingEvent()?.date }} à {{ pendingEvent()?.time }} ?
      </p>

      <div class="mt-6 flex justify-center gap-3">
        <button
          type="button"
          (click)="cancelSubmit()"
          class="rounded-full border border-stone-200 px-6 py-2 text-xs font-semibold uppercase tracking-wide text-stone-500 transition hover:bg-stone-50"
        >
          Annuler
        </button>

        <button
          type="button"
          (click)="confirmSubmit()"
          class="rounded-full bg-orange-100 px-6 py-2 text-xs font-semibold uppercase tracking-wide text-orange-600 transition hover:bg-orange-200"
        >
          Confirmer
        </button>
      </div>
    </div>
  </div>
}
