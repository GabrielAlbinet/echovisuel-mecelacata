<div class="grid lg:grid-cols-4 gap-5">
  @for(festival of festivals(); track festival.name) {
  <div class="flex flex-col justify-center">
    <app-festival-infocomponent [infos]="festival"></app-festival-infocomponent>
    <app-festival-datescomponent [dates]="festival.dates"></app-festival-datescomponent>
    <button
      class="bg-transparent hover:bg-blue-500 text-blue-700 font-semibold hover:text-white py-2 px-4 border border-blue-500 hover:border-transparent rounded"
      [routerLink]="['/festival', festival.name,'edit']">Modifier</button>
  </div>
  }@empty {
  <p>Aucun festival de prévu.</p>
  }
</div>
