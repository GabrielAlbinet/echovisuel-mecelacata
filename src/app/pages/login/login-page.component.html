<section class="mx-auto mt-12 max-w-sm rounded-2xl border border-stone-200 bg-white p-8 shadow-sm">
  <h1 class="mb-6 text-2xl font-bold text-stone-900">Connexion</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
    <input
      type="email"
      formControlName="email"
      placeholder="E-mail"
      autocomplete="email"
      class="rounded-full border border-stone-200 px-4 py-2 text-sm text-stone-900"
    />

    <input
      type="password"
      formControlName="password"
      placeholder="Mot de passe"
      autocomplete="current-password"
      class="rounded-full border border-stone-200 px-4 py-2 text-sm text-stone-900"
    />

    @if (errorMessage()) {
      <p class="text-sm text-red-600">{{ errorMessage() }}</p>
    }

    <button
      type="submit"
      class="rounded-full bg-orange-100 px-4 py-2 text-xs font-semibold uppercase tracking-wide text-orange-600 transition hover:bg-orange-200"
    >
      Se connecter
    </button>
  </form>
</section>
