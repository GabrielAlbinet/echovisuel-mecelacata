<button (click)="showForm=!showForm">Création billet :</button>
@if(isAdmin==true && showForm==true){
    <app-create-ticket (createdticket)="createdticket($event)"></app-create-ticket>
}
<div  class="grid md:grid-cols-5 md:grid-rows-4 grid-cols-2 grid-rows-10 gap-2 p-8 ">
    @for(ticket of ticketList();track ticket){
        <app-ticket-card [ticket]="ticket" (selectedTicket)="selectedTicket($event)"></app-ticket-card>
    }
</div>
