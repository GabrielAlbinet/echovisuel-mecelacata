<section class="mx-auto max-w-6xl">
  <h1 class="mb-10 text-4xl font-black">Programme du festival</h1>

  <div class="mb-16">
    <app-schedule-form (eventCreated)="onEventCreated($event)" />
  </div>

  @if (isLoading()) {
    <p class="text-stone-500">Chargement du programme...</p>
  } @else if (sortedDateKeys().length === 0) {
    <p class="text-stone-500">Aucun événement n'est programmé pour le moment.</p>
  } @else {
    <app-schedule-list [dateKeys]="sortedDateKeys()" [groupedEvents]="groupedEvents()" />
  }
</section>
