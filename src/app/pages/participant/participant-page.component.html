<app-participant-form
  [participantToEdit]="participantToEdit()"
  (participantSaved)="onParticipantSaved()"
  (editCancelled)="onEditCancelled()"
/>
<app-participant-search />
<app-participant-list (edit)="onEditRequested($event)" (remove)="onRemoveRequested($event)" />

@if (participantToDelete(); as participant) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-stone-900/40 px-6">
    <div class="w-full max-w-sm rounded-2xl border border-stone-200 bg-white p-6 text-center shadow-sm">
      <p class="text-lg font-bold text-stone-900">Supprimer ce participant ?</p>
      <p class="mt-2 text-sm text-stone-500">
        {{ participant.firstName }} {{ participant.lastName }} ({{ participant.email }}) sera supprimé.
      </p>

      <div class="mt-6 flex justify-center gap-3">
        <button
          type="button"
          (click)="cancelRemove()"
          class="rounded-full border border-stone-200 px-6 py-2 text-xs font-semibold uppercase tracking-wide text-stone-500 transition hover:bg-stone-50"
        >
          Annuler
        </button>

        <button
          type="button"
          (click)="confirmRemove()"
          class="rounded-full bg-red-100 px-6 py-2 text-xs font-semibold uppercase tracking-wide text-red-600 transition hover:bg-red-200"
        >
          Supprimer
        </button>
      </div>
    </div>
  </div>
}
